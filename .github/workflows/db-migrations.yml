# Verifies the PostgreSQL migrations (system/server/migrations/) for real,
# against an ephemeral PostgreSQL service container — this is the only place
# they are actually run. No PostgreSQL is available in the environment that
# authored them; do not treat migrations or their RLS policies as verified
# based on anything other than this workflow being green.
#
# Runs: migrate up, a real tenant-isolation test (see
# test/integration/db/tenantIsolation.test.js) through a non-superuser role,
# migrate down, then migrate up again to prove the round trip is clean.

name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - "system/server/migrations/**"
      - "system/server/src/db/**"
      # Every M04 identity/organization service, not the M02 file-backed
      # ones (auditService.js etc.) — but simpler to over-trigger on an
      # unrelated services/ change than to keep hand-maintaining one path
      # entry per new identity service file.
      - "system/server/src/services/organizationIdentityService.js"
      - "system/server/src/services/identitySessionService.js"
      - "system/server/src/services/invitationService.js"
      - "system/server/src/services/identityMfaService.js"
      - "system/server/src/services/emailActionService.js"
      - "system/server/src/cloudApi/**"
      - "system/server/test/**/db/**"
      - "system/server/test/unit/cloudApi/**"
      - "system/package.json"
      - "system/package-lock.json"
      - ".github/workflows/db-migrations.yml"
  pull_request:
    paths:
      - "system/server/migrations/**"
      - "system/server/src/db/**"
      - "system/server/src/services/organizationIdentityService.js"
      - "system/server/src/services/identitySessionService.js"
      - "system/server/src/services/invitationService.js"
      - "system/server/src/services/identityMfaService.js"
      - "system/server/src/services/emailActionService.js"
      - "system/server/src/cloudApi/**"
      - "system/server/test/**/db/**"
      - "system/server/test/unit/cloudApi/**"
      - "system/package.json"
      - "system/package-lock.json"
      - ".github/workflows/db-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: phonefarm_test
  PGHOST: localhost
  PGPORT: "5432"

defaults:
  run:
    shell: bash
    working-directory: system

jobs:
  migrate:
    name: Migrate up / tenant isolation / migrate down / up again
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phonefarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: system/package-lock.json

      - name: Install server dependencies (lockfile)
        run: npm ci

      - name: Production dependency audit (server)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit gate (what each finding can reach)
        working-directory: .
        run: node desktop/scripts/audit-gate.cjs --dir system

      - name: Migrate up
        run: npm run migrate up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/phonefarm_test

      # Run every database integration file from the repository's real layout.
      # Concurrency stays at one because these tests intentionally migrate and
      # reset the same disposable service database. The glob prevents a newly
      # added database contract from silently being omitted by a stale list.
      - name: Real PostgreSQL integration suite — all database contracts
        run: node --test --test-concurrency=1 server/test/integration/db/*.test.js
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phonefarm_test

      - name: Changed JavaScript entry points pass node --check
        run: |
          for f in server/src/db/pool.js server/src/db/health.js server/src/db/transaction.js \
                   server/src/db/defaultOrganization.js \
                   server/src/db/repositories/*.js server/src/services/organizationIdentityService.js \
                   server/src/services/identitySessionService.js server/src/services/invitationService.js \
                   server/src/services/identityMfaService.js server/src/services/emailActionService.js \
                   server/src/cloudApi/createCloudApi.js server/src/cloudApi/middleware/*.js \
                   server/migrations/*.js server/scripts/migrate-sites-to-postgres.js \
                   server/scripts/migrate-assignments-to-postgres.js server/scripts/migrate-policies-to-postgres.js \
                   server/scripts/migrate-task-queue-to-postgres.js server/scripts/migrate-approvals-to-postgres.js \
                   server/scripts/migrate-interventions-to-postgres.js server/scripts/migrate-proxy-pool-to-postgres.js \
                   server/scripts/migrate-audit-log-to-postgres.js server/scripts/migrate-research-to-postgres.js; do
            node --check "$f"
          done
