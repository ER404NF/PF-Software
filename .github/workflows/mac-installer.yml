# Builds the macOS installer users download:  Phone-Farm-<version>-<arch>.pkg
#
# End users never build anything: they download the .pkg from the GitHub Release
# and double-click it. This workflow is where the source is tested, built, signed,
# notarized and verified. Tests GATE the release; they never run on a user's Mac.
#
# Push a tag such as v0.1.0 (must equal desktop/package.json "version") to publish
# a Release. Branch pushes and pull requests build and verify but do not publish.
#
# Optional repository secrets (never hard-coded; without them the package is built
# as an explicitly named -UNSIGNED development artifact, and a tagged release FAILS
# unless the repository variable ALLOW_UNSIGNED_RELEASE is set to "true"):
#   MACOS_APP_CERT_P12_BASE64        Developer ID Application certificate (.p12, base64)
#   MACOS_APP_CERT_PASSWORD
#   MACOS_INSTALLER_CERT_P12_BASE64  Developer ID Installer certificate (.p12, base64)
#   MACOS_INSTALLER_CERT_PASSWORD
#   Notarization - either an App Store Connect API key (preferred):
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
#   - or an Apple ID:  APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD
# See docs/MAC_RELEASE.md.

name: macOS installer

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - "system/**"
      - ".github/workflows/mac-installer.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "system/**"
      - ".github/workflows/mac-installer.yml"
  workflow_dispatch:
    inputs:
      universal:
        description: "Also build the universal (Apple silicon + Intel) installer"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mac-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${{ inputs.universal }}" == "true" ]]; then
            echo 'matrix={"arch":["arm64","universal"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"arch":["arm64"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }} installer
    needs: plan
    runs-on: macos-14 # Apple silicon
    timeout-minutes: 120
    # arm64 is the primary installer and must succeed; universal is best-effort.
    continue-on-error: ${{ matrix.arch == 'universal' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            system/package-lock.json
            desktop/package-lock.json

      - name: Release tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}" >&2
            exit 1
          fi

      # ---- gates: nothing below runs unless the whole source tree is healthy ----
      - name: Install server dependencies (lockfile)
        working-directory: system
        run: npm ci

      - name: Server test suite (full)
        working-directory: system
        env:
          # Run under a zone that is neither the California scheduling default nor UTC:
          # scheduling must not depend on the host operating system's timezone.
          TZ: Asia/Tokyo
        run: npm test

      - name: Install desktop dependencies (lockfile)
        working-directory: desktop
        run: |
          npm ci
          node scripts/ensure-electron.cjs

      - name: Desktop tests
        working-directory: desktop
        run: npm test

      - name: Production dependency audit (server)
        working-directory: system
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit gates (what each finding can reach)
        run: |
          node desktop/scripts/audit-gate.cjs --dir system
          node desktop/scripts/audit-gate.cjs --dir desktop

      # ---- signing material (optional; absent => explicitly UNSIGNED package) ----
      - name: Import Apple signing certificates
        env:
          MACOS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_APP_CERT_P12_BASE64:-}" || -z "${MACOS_INSTALLER_CERT_P12_BASE64:-}" ]]; then
            echo "Signing certificates are not configured - the installer will be built UNSIGNED."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/phonefarm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${MACOS_APP_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/app.p12"
          echo "${MACOS_INSTALLER_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/installer.p12"
          security import "${RUNNER_TEMP}/app.p12" -k "${KEYCHAIN}" -P "${MACOS_APP_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security import "${RUNNER_TEMP}/installer.p12" -k "${KEYCHAIN}" -P "${MACOS_INSTALLER_CERT_PASSWORD}" -T /usr/bin/productbuild -T /usr/bin/pkgbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | sed 's/"//g')
          rm -f "${RUNNER_TEMP}/app.p12" "${RUNNER_TEMP}/installer.p12"
          echo "PHONE_FARM_SIGNING_KEYCHAIN=${KEYCHAIN}" >> "${GITHUB_ENV}"
          security find-identity -v "${KEYCHAIN}"

      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_P8_BASE64:-}" ]]; then
            echo "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
            chmod 600 "${RUNNER_TEMP}/AuthKey.p8"
            echo "APPLE_API_KEY=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
          fi

      # ---- build ----
      - name: Build, sign, notarize and verify the .pkg
        id: build
        working-directory: desktop
        env:
          PHONE_FARM_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PHONE_FARM_ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/build-mac-pkg.cjs --arch "${{ matrix.arch }}"

      - name: Verify the .pkg again from scratch
        working-directory: desktop
        run: |
          node scripts/build-mac-pkg.cjs --verify "${{ steps.build.outputs.pkg_path }}" --arch "${{ matrix.arch }}" --expect "${{ steps.build.outputs.signing_level }}"

      - name: Install the .pkg with macOS Installer and boot the installed app's server
        run: |
          set -euo pipefail
          sudo installer -pkg "${{ steps.build.outputs.pkg_path }}" -target / -verboseR
          test -d "/Applications/Phone Farm.app"
          node desktop/scripts/verify-packaged-runtime.cjs \
            "/Applications/Phone Farm.app/Contents/Resources" \
            "/Applications/Phone Farm.app/Contents/MacOS/Phone Farm" --require-wda
          sudo rm -rf "/Applications/Phone Farm.app"

      - name: Summary
        run: |
          {
            echo "### Phone Farm installer (${{ matrix.arch }})"
            echo ""
            echo "- File: \`$(basename "${{ steps.build.outputs.pkg_path }}")\`"
            echo "- Signing level: **${{ steps.build.outputs.signing_level }}**"
            echo "- Installed with macOS Installer on a clean runner and the packaged server booted: yes"
            echo "- Real iPhones tested: **no** (CI has no devices) - see docs/MAC_INSTALLER_ACCEPTANCE.md"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: phone-farm-pkg-${{ matrix.arch }}
          path: ${{ steps.build.outputs.pkg_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${PHONE_FARM_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${PHONE_FARM_SIGNING_KEYCHAIN}" || true
          fi
          rm -f "${RUNNER_TEMP}/AuthKey.p8"

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phone-farm-pkg-*
          path: release
          merge-multiple: true

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          ls -l
          primary="Phone-Farm-${GITHUB_REF_NAME#v}-arm64.pkg"
          download="${primary}"
          if [[ -f "${primary}" ]]; then
            cp "${primary}" Phone-Farm-macOS.pkg
            download="Phone-Farm-macOS.pkg"
          else
            # Never hide an unsigned/not-notarized build behind the trusted stable name.
            download="$(find . -maxdepth 1 -type f -name 'Phone-Farm-*-arm64*.pkg' | head -n 1 | sed 's#^./##')"
          fi
          if [[ -z "${download}" ]]; then
            echo "The arm64 installer is missing." >&2
            exit 1
          fi
          shasum -a 256 ./*.pkg | sed 's# \./# #' > SHA256SUMS.txt
          prerelease=()
          notes="Download **${download}** below, double-click it, and follow the installer. You do not need Node.js, npm, Terminal or the source code.

          Which file: \`arm64\` = Apple silicon Macs; \`universal\` = Apple silicon and Intel Macs.
          Verify the download with \`SHA256SUMS.txt\`."
          if ls ./*UNSIGNED.pkg ./*NOT-NOTARIZED.pkg > /dev/null 2>&1; then
            prerelease=(--prerelease)
            notes="${notes}

          **WARNING - not signed/notarized.** The package(s) named UNSIGNED or NOT-NOTARIZED were built without complete Apple signing credentials. macOS Gatekeeper will show a warning: open the package with Control-click > Open, or allow it under System Settings > Privacy & Security. This is a development build, not the final seamless installer."
          fi
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ./*.pkg SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ./*.pkg SHA256SUMS.txt \
              --title "Phone Farm ${GITHUB_REF_NAME}" --notes "${notes}" "${prerelease[@]}"
          fi
