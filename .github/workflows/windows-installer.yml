# Builds the Windows installer for remote operators:  Phone-Farm-Setup-<version>.exe
#
# Operators on Windows PCs download this, run it, choose "Connect to an existing
# Phone Farm host" and type the hub address. (The Mac-only host and site modes are
# hidden on Windows; iPhone automation needs macOS and Xcode.) Tests gate the build.
#
# Push a tag such as v0.1.0 (must equal desktop/package.json "version") to publish the
# installer on the GitHub Release. Branch pushes and pull requests build it as an
# artifact only. The installer is not code-signed unless you add signing secrets;
# Windows SmartScreen warns about unsigned installers until reputation builds.

name: Windows installer

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - "system/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "system/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            system/package-lock.json
            desktop/package-lock.json

      - name: Release tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}" >&2
            exit 1
          fi

      - name: Install server dependencies (lockfile)
        working-directory: system
        run: npm ci

      - name: Server test suite (full)
        working-directory: system
        env:
          TZ: Asia/Tokyo
        run: npm test

      - name: Install desktop dependencies (lockfile)
        working-directory: desktop
        run: |
          npm ci
          node scripts/ensure-electron.cjs

      - name: Desktop tests
        working-directory: desktop
        run: npm test

      - name: Build the installer
        working-directory: desktop
        run: npm run dist:win

      - name: Installer must exist
        run: |
          shopt -s nullglob
          files=(desktop/dist/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer was produced in desktop/dist" >&2
            exit 1
          fi
          ls -la "${files[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: phone-farm-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-farm-windows-installer
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*.exe
          fail_on_unmatched_files: true
